<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>महिनाका सबै पेशी सूची</title>
<link rel="stylesheet" href="cause-list-ribbon.css?v=compact-editor-1">
<style>
:root{--maroon:#681925;--gold:#c69232;--paper:#f6f1e9;--ink:#302725;--muted:#716761;--line:#d7ccc0}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Noto Sans Devanagari","Nirmala UI",Mangal,system-ui,sans-serif}button,a{font:inherit}.topbar{position:relative;z-index:50;color:#fff;background:linear-gradient(112deg,#491019,var(--maroon));border-bottom:3px solid var(--gold);box-shadow:0 5px 18px #32121633}.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;width:min(1180px,calc(100% - 28px));min-height:68px;margin:auto;padding:10px 0}.title h1{margin:0;font-size:1.12rem}.title p{margin:3px 0 0;color:#f1ddaa;font-size:.78rem}.tools{display:flex;flex-wrap:wrap;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 12px;color:#fff;background:#ffffff1a;border:1px solid #ffffff6b;border-radius:8px;text-decoration:none;cursor:pointer}.primary{color:#3b2910;background:#f2d58e;border-color:#f2d58e;font-weight:800}main{width:min(1180px,calc(100% - 28px));margin:20px auto 34px}.status{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;padding:11px 14px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:10px;font-size:.82rem}.status.error{color:#9a2433;border-color:#d9a9ae;background:#fff5f5}.stack{display:grid;gap:22px}.day{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 10px 30px #37251f14}.day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;color:#fff;background:#7a2632}.day-head h2{margin:0;font-size:.96rem}.day-head a{color:#f5dfa8;font-size:.76rem;font-weight:700;text-decoration:none}.day iframe{display:block;width:100%;height:1200px;border:0;background:#fff}.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px}@media(max-width:700px){.topbar-inner,.day-head,.status{align-items:flex-start;flex-direction:column}.tools{width:100%}.btn{flex:1}main{width:calc(100% - 16px);margin-top:10px}.day iframe{height:950px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="title"><h1 id="title">महिनाका सबै पेशी सूची</h1><p>मितिअनुसार क्रमबद्ध continuous main-content view</p></div><div class="tools"><a class="btn" href="index.html">← मुख्य पृष्ठ</a><button class="btn primary" id="download" type="button">Download index.json</button></div></div></header>
<main><div class="status" id="status"><span id="pageStatus">पेशी सूची तयार हुँदैछन्…</span><span id="rowStatus">Rows: —</span></div><div class="stack" id="stack"></div></main>
<script>
(()=>{"use strict";
const MONTH_NAMES=["वैशाख","जेठ","असार","साउन","भदौ","असोज","कात्तिक","मंसिर","पुस","माघ","फागुन","चैत"],CACHE="cause-list-auto-files-v1",q=new URLSearchParams(location.search),monthParam=String(q.get("month")||""),allMonths=monthParam.toLowerCase()==="all",month=monthParam.replace(/\D/g,"").slice(0,6),title=document.getElementById("title"),status=document.getElementById("status"),pageStatus=document.getElementById("pageStatus"),rowStatus=document.getElementById("rowStatus"),stack=document.getElementById("stack"),resources={},received=new Set;let pages=[];
const nepali=value=>String(value).replace(/\d/g,d=>"०१२३४५६७८९"[d]);
function parse(value){let name=String(value||"").trim();if(/^\d{8}$/.test(name))name=`index${name}.html`;name=name.split(/[?#]/)[0].split(/[\\/]/).pop()||"";try{name=decodeURIComponent(name)}catch(error){}const found=name.match(/^index(\d{8})\.html?$/i);if(!found)return null;const key=found[1],m=+key.slice(4,6),d=+key.slice(6);return m>0&&m<13&&d>0&&d<33?{key,label:nepali(`${key.slice(0,4)}।${key.slice(4,6)}।${key.slice(6)}`),href:`index${key}.html`}:null}
function unique(items){const map=new Map;(items||[]).forEach(item=>{const page=item&&item.key?item:parse(item);if(page&&(allMonths||page.key.slice(0,6)===month))map.set(page.key,page)});return [...map.values()].sort((a,b)=>a.key.localeCompare(b.key))}
function cached(){try{const data=JSON.parse(localStorage.getItem(CACHE)||"[]");return Array.isArray(data)?data:[]}catch(error){return[]}}
async function manifest(){try{const url=new URL("cause-list-files.js",new URL(".",location.href));url.searchParams.set("v",Date.now());const response=await fetch(url,{cache:"no-store"}),data=await response.json();return response.ok&&Array.isArray(data)?data:[]}catch(error){return[]}}
function githubUrls(){if(!/\.github\.io$/i.test(location.hostname))return[];const owner=location.hostname.split(".")[0],parts=location.pathname.split("/").filter(Boolean);if(parts.length&&/\.html?$/i.test(parts.at(-1)))parts.pop();const items=[];if(parts.length){const project=parts.slice(),repo=project.shift();items.push([repo,project.join("/")])}items.push([`${owner}.github.io`,parts.join("/")]);return items.filter((item,i,list)=>list.findIndex(x=>x[0]===item[0]&&x[1]===item[1])===i).map(item=>`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(item[0])}/contents/${item[1]}`)}
async function discover(){if(!/^https?:$/.test(location.protocol))return[];const generated=await manifest();if(generated.length)return generated;const found=[];try{const response=await fetch(new URL(".",location.href),{cache:"no-store"}),doc=new DOMParser().parseFromString(await response.text(),"text/html");if(response.ok)doc.querySelectorAll("a[href]").forEach(a=>found.push(a.getAttribute("href")))}catch(error){}for(const api of githubUrls())try{const response=await fetch(api,{headers:{Accept:"application/vnd.github+json"},cache:"no-store"}),data=await response.json();if(response.ok&&Array.isArray(data)){data.filter(item=>item.type==="file").forEach(item=>found.push(item.name));if(found.length)break}}catch(error){}return found}
function frame(key){return stack.querySelector(`[data-key="${key}"] iframe`)}
function render(){if((!allMonths&&!/^\d{6}$/.test(month))||!pages.length){title.textContent=allMonths?"पेशी सूची भेटिएन":"महिना भेटिएन";status.classList.add("error");pageStatus.textContent=allMonths?"कुनै उपलब्ध पेशी सूची भेटिएन।":"दिइएको महिनाको पेशी सूची उपलब्ध छैन।";rowStatus.textContent="Rows: ०";stack.innerHTML='<div class="empty">मुख्य पृष्ठमा फर्केर उपलब्ध मिति रोज्नुहोस्।</div>';return}const number=+month.slice(4),label=allMonths?"सबै उपलब्ध मिति":nepali(`${month.slice(0,4)}।${month.slice(4)}`)+(MONTH_NAMES[number-1]?` — ${MONTH_NAMES[number-1]}`:"");document.title=`${label} — सबै पेशी सूची`;title.textContent=`${label} — सबै पेशी सूची`;pageStatus.textContent=`${nepali(pages.length)} वटा मिति कालक्रमअनुसार राखिएका छन्।`;pages.forEach(page=>{const section=document.createElement("section");section.className="day";section.dataset.key=page.key;section.innerHTML=`<div class="day-head"><h2>${page.label} को पेशी सूची</h2><a href="${page.href}">छुट्टै पृष्ठमा खोल्नुहोस् ↗</a></div><iframe title="${page.label} को पेशी सूची" src="${page.href}" scrolling="no" loading="eager"></iframe>`;stack.appendChild(section)})}
function receive(event){const data=event.data,key=String(data&&data.dateKey||""),page=pages.find(item=>item.key===key),target=page&&frame(key);if(!target||(event.source&&event.source!==target.contentWindow))return;if(data.type==="cob-month-height"){const height=Number(data.height);if(Number.isFinite(height)&&height>=300)target.style.height=Math.min(Math.max(Math.ceil(height)+8,500),24000)+"px";return}if(data.type!=="cob-month-manifest")return;(Array.isArray(data.stems)?data.stems:[]).forEach(stem=>{const value=String(stem||"");if(!new RegExp(`^${key}\\.\\d{2}\\.\\d{2}\\.[a-z0-9]+-\\d+$`,"i").test(value))return;const file=`${value}.txt`;resources[value]=[{type:"file",path:`order/${key}/${file}`,label:file}]});received.add(key);rowStatus.textContent=`Rows: ${nepali(Object.keys(resources).length)}`;pageStatus.textContent=`${nepali(received.size)}/${nepali(pages.length)} वटा पृष्ठ तयार भए।`}
function download(){const keys=Object.keys(resources).sort();if(!keys.length){status.classList.add("error");pageStatus.textContent="Rows अझै तयार हुँदैछन्। केही क्षणपछि पुनः प्रयास गर्नुहोस्।";return}status.classList.remove("error");const all={};keys.forEach(key=>all[key]=resources[key]);const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,resources:all},null,2)+"\n"],{type:"application/json;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="index.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);pageStatus.textContent="सबै प्राप्त rows को index.json डाउनलोड भयो।"}
async function init(){const requested=String(q.get("files")||"").split(",").filter(Boolean);pages=unique(requested.length?requested:[...cached(),...await discover()]);render()}
addEventListener("message",receive);document.getElementById("download").addEventListener("click",download);init();
})();
</script>
<script src="cause-list-ribbon.js?v=search-history-2"></script>
</body>
</html>
